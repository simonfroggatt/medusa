{% load static %}{% if widget.is_initial %}<div class="mb-2">
    <img src="{% get_media_prefix %}{{ widget.value.name }}" alt="" style="max-height:90px;max-width:100%;border:1px solid #ddd;border-radius:3px;">
    <div class="small text-muted">{{ widget.value.name }}</div>
    {% if not widget.required %}<div class="form-check">
        <input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}" class="form-check-input"{% if widget.attrs.disabled %} disabled{% endif %}>
        <label class="form-check-label" for="{{ widget.checkbox_id }}">Remove this image</label>
    </div>{% endif %}
</div>{% endif %}<input type="{{ widget.type }}" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %}>
