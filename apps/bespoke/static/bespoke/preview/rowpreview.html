<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Row preview</title>
  <meta name="robots" content="noindex">
  <style>html,body{background:#f4f5f7;height:100%;margin:0}#band{box-sizing:border-box;justify-content:center;align-items:center;height:100%;padding:10px;display:flex}#band svg{width:100%;height:auto;max-height:100%}#band .note{color:#6b7280;text-align:center;font:14px/1.4 system-ui,sans-serif}</style>
  <script type="module" crossorigin src="./assets/rowpreview-DMwHeI48.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/src-RRc00Hpe.js">
  <link rel="modulepreload" crossorigin href="./assets/symbols-Rkl-EZHe.js">
  <link rel="modulepreload" crossorigin href="./assets/fireAction-CVRSeh36.js">
</head>
<body>
  <div id="band"><span class="note">Loading…</span></div>
  <script>
    // The engine only sends cookies when the page carries a host config, and
    // the feed this preview reads sits behind a login. Without this the fetch
    // goes out anonymous, Medusa answers with its sign-in page, and the first
    // thing JSON.parse sees is a '<'.
    (function () {
      var data = new URLSearchParams(location.search).get('data');
      if (!data) return;
      var tag = document.createElement('script');
      tag.type = 'application/json';
      tag.id = 'sign-designer-config';
      tag.textContent = JSON.stringify({ dataUrl: data, noBasket: true });
      document.head.appendChild(tag);
    })();
  </script>
</body>
</html>
